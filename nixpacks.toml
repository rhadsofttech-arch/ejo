# Build settings for Nixpacks (used by ZevCloud). Node 18 has been retired, so pin Node 22.
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["echo 'No dependencies to install'"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server.js"
