<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Ejo: a 3D Nokia-style snake game set in the Nigerian bush.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ejo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D board; HUD chips pinned to the top edge; menus are panels over the live scene (snake picker docks left on wide screens so the snake stays visible) */
:root{
  --bush:#0e1d15;      /* deep bush green ground */
  --leaf:#3f9a4f;      /* venom bar filling */
  --danfo:#f5c518;     /* danfo-bus yellow, the one accent */
  --laterite:#c4532d;  /* red earth: type shadow, warnings */
  --cream:#f4ecd9;
  --muted:#a9bba9;
  --ink:#0b130e;
  --panel:rgba(11,22,16,.9);
  --line:rgba(244,236,217,.14);
  --warn:#ff8a6a;
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bush);color:var(--cream);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--danfo);outline-offset:2px}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:2}
.chip{background:rgba(9,18,13,.76);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:3px;backdrop-filter:blur(6px);min-width:0}
.chip small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip b{font-family:var(--display);font-weight:400;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.chip.right{align-items:flex-end;pointer-events:auto}
.venom{flex:1;max-width:300px;align-self:stretch;justify-content:center}
.bar{height:10px;border-radius:6px;background:rgba(244,236,217,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .15s linear}
.bar.full i{background:var(--danfo);box-shadow:0 0 12px var(--danfo)}
.skins{display:flex;gap:4px}
.skins span{width:14px;height:8px;border-radius:4px;background:var(--danfo)}
.skins span.gone{background:rgba(244,236,217,.18)}
.row{display:flex;gap:10px;align-items:center}
.mute{pointer-events:auto;background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--muted)}
#hSpit{font-size:12px;color:var(--muted)}
#hSpit.ready{color:var(--danfo)}

#mini{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 112px);width:140px;height:140px;border-radius:12px;border:1px solid var(--line);background:rgba(9,18,13,.75);z-index:2;pointer-events:none}
@media (max-width:460px){#mini{width:96px;height:96px;top:calc(env(safe-area-inset-top,0px) + 104px)}}
#toast{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%) scale(.96);background:var(--panel);border:1px solid var(--line);padding:12px 18px;border-radius:14px;font-weight:600;max-width:min(88vw,420px);text-align:center;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:3;text-wrap:balance}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast.bad{border-color:var(--laterite)}
#toast.good{border-color:var(--danfo)}
#toast big{display:block;font-family:var(--display);font-size:30px;color:var(--danfo);margin-bottom:2px}
#toast.bad big{color:var(--warn)}

#pad{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;z-index:2}
#pad button{background:rgba(9,18,13,.72);border:1px solid var(--line);border-radius:14px;font-size:22px;color:var(--cream)}
#pad button:active{background:var(--danfo);color:var(--ink)}
#pad .u{grid-column:2}#pad .l{grid-column:1;grid-row:2}#pad .d{grid-column:2;grid-row:2}#pad .r{grid-column:3;grid-row:2}
#pad .sp{grid-column:1;grid-row:1;font-size:13px;font-weight:800}
#pauseBtn{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:2;background:rgba(9,18,13,.72);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}

#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:4;background:radial-gradient(ellipse at center,rgba(8,16,11,.3),rgba(8,16,11,.78))}
#screen.side{background:linear-gradient(90deg,rgba(8,16,11,.8),rgba(8,16,11,.15) 70%)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%;max-width:560px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(8px)}
.panel.wide{max-width:720px}
@media (min-width:1100px){#screen.side{justify-content:flex-start;padding-left:4vw}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,18vw,112px);line-height:.85;margin:0;color:var(--danfo);text-shadow:0 5px 0 var(--laterite),0 9px 18px rgba(0,0,0,.45);letter-spacing:.02em}
h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1;margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--danfo);font-weight:800}
.eyebrow.warn{color:var(--warn)}.eyebrow.quiet{color:var(--muted)}
.tag{margin:6px 0 0;line-height:1.5;max-width:58ch}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lv{text-align:left;background:rgba(244,236,217,.05);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.lv.final{grid-column:1/-1;border-color:rgba(196,83,45,.6)}
.lv:hover:not(:disabled){border-color:var(--danfo);background:rgba(245,197,24,.08)}
.lv:disabled{opacity:.4;cursor:not-allowed}
.lv .n{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lv b{font-family:var(--display);font-weight:400;font-size:20px}
.lv small{color:var(--muted)}
.snakes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sn{text-align:left;background:rgba(244,236,217,.04);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sn:hover{border-color:rgba(245,197,24,.5)}
.sn.on{border-color:var(--danfo);background:rgba(245,197,24,.08);box-shadow:inset 0 0 0 1px var(--danfo)}
.sn .hd{display:flex;gap:10px;align-items:center}
.snakeimg,.shopimg{display:block;width:100%;height:auto;aspect-ratio:400/210;border-radius:10px;background:radial-gradient(ellipse at 50% 62%,rgba(90,150,70,.32),rgba(20,40,26,.2) 70%)}
.shopimg{margin:-2px 0 2px}
.skinimg{width:64px;height:auto;aspect-ratio:400/210;border-radius:6px;background:rgba(90,150,70,.18)}
.yourimg{width:150px;max-width:38vw;height:auto;aspect-ratio:400/210;border-radius:10px;background:radial-gradient(ellipse at 50% 62%,rgba(90,150,70,.32),rgba(20,40,26,.2) 70%)}
.sw{width:34px;height:34px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,var(--b) 0 22%,var(--a) 23%);border:2px solid rgba(244,236,217,.25)}
.sn b.nm{font-family:var(--display);font-weight:400;font-size:20px;display:block;line-height:1.1}
.sn small{color:var(--muted);font-size:12px}
.st{display:flex;flex-direction:column;gap:4px;font-size:12px}
.st div{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips i{height:7px;flex:1;max-width:22px;border-radius:3px;background:rgba(244,236,217,.13)}
.pips i.f{background:var(--danfo)}
.pro,.con{font-size:13px;line-height:1.4;display:block}
.pro b,.con b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.pro b{color:var(--danfo)}.con b{color:var(--warn)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{border-radius:12px;padding:12px 20px;font-weight:800;border:1px solid var(--line);background:transparent}
.btn.primary{background:var(--danfo);color:var(--ink);border-color:var(--danfo)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:not(.primary):hover{border-color:var(--cream)}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:800}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
.who h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.who ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.who li{display:grid;grid-template-columns:12px 1fr;gap:8px;font-size:13px;line-height:1.35}
.who li i{width:12px;height:12px;border-radius:50%;margin-top:3px;background:var(--c)}
.who li b{display:block;font-size:14px}
.keys{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stats b{font-family:var(--display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.threats{display:flex;gap:8px;flex-wrap:wrap}
.threats span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.threats span i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.yours{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:12px}
.yours div{display:flex;flex-direction:column;gap:6px;min-width:0}
#sheet{position:fixed;inset:0;z-index:6;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:rgba(5,10,7,.62)}
@media (min-width:640px){#sheet{align-items:center}}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(10px)}
.sheet h3{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05}
.price{font-family:var(--display);font-size:44px;color:var(--danfo);line-height:1;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input{font:inherit;font-size:16px;color:var(--cream);background:rgba(244,236,217,.06);border:1px solid var(--line);border-radius:10px;padding:12px;-webkit-user-select:text;user-select:text}
.field input:focus{outline:2px solid var(--danfo);outline-offset:1px}
.err{color:var(--warn);font-size:13px;font-weight:600}
.demo{font-size:12px;line-height:1.45;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.shopgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:rgba(244,236,217,.04);min-width:0}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .top>span{display:flex;gap:8px;align-items:center;min-width:0}
.item b.nm{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.item p{font-size:13px;color:var(--muted);flex:1}
.item .sw{width:22px;height:22px;border-width:1px}
.badge{font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--laterite);color:var(--cream);border-radius:999px;padding:2px 8px;font-weight:800;white-space:nowrap}
.buy{border-radius:10px;padding:9px 14px;font-weight:800;border:1px solid var(--danfo);background:var(--danfo);color:var(--ink);align-self:flex-start;font-variant-numeric:tabular-nums}
.buy.ghost{background:transparent;color:var(--cream);border-color:var(--line)}
.buy[disabled]{opacity:.55;cursor:default}
.cat{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.invrow{display:flex;gap:8px;flex-wrap:wrap}
.invrow span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.invrow b{color:var(--danfo);font-variant-numeric:tabular-nums}
.lockp{font-size:12px;font-weight:800;color:var(--ink);background:var(--danfo);border-radius:999px;padding:3px 10px;align-self:flex-start}
.skinrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.skinbtn{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:5px 12px 5px 5px;background:transparent;font-size:13px}
.skinbtn.on{border-color:var(--danfo);background:rgba(245,197,24,.1)}
.skinbtn .sw{width:18px;height:18px;border-width:1px}
.boosts{display:flex;flex-direction:column;gap:8px}
.tog{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:#f5c518}
.tog small{color:var(--muted)}
.link{background:none;border:none;color:var(--danfo);text-decoration:underline;padding:0;font-weight:700}
.shopcta{border-color:rgba(245,197,24,.45)}
.event{border:1px solid rgba(245,197,24,.4);background:rgba(245,197,24,.08);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.45}
.weather{border-left:3px solid #9fc3e8;padding:4px 10px;font-size:14px;color:var(--cream)}
.streak{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.streak span{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.streak span b{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.streak span.on{border-color:var(--danfo);color:var(--danfo);background:rgba(245,197,24,.08)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(244,236,217,.05);display:flex;flex-direction:column;gap:3px;min-width:0}
.mode:hover{border-color:var(--danfo);background:rgba(245,197,24,.08)}
.mode.daily{border-color:rgba(245,197,24,.5);background:rgba(245,197,24,.07)}
.mode.daily.done{opacity:.7}
.mode .n{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--danfo);font-weight:800}
.mode b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.15}
.mode small{color:var(--muted)}
.dot{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--laterite);color:var(--cream);font-size:12px;margin-left:4px;padding:0 5px}
.sn .hd{justify-content:space-between}
.lvl{font-family:var(--display);font-size:16px;color:var(--danfo);border:1px solid rgba(245,197,24,.4);border-radius:8px;padding:1px 8px;white-space:nowrap}
.xpbar{display:block;height:6px;border-radius:4px;background:rgba(244,236,217,.12);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--danfo)}
.xpt{font-size:12px;color:var(--muted);line-height:1.35}
.stats b.goal{font-size:20px;line-height:1.15}
.quote{margin:0;border-left:3px solid var(--danfo);padding:6px 12px;font-size:17px;font-style:italic;font-weight:600}
.quote small{display:block;font-style:normal;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.duelrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-variant-numeric:tabular-nums}
.duelrow.win{border-color:var(--danfo);background:rgba(245,197,24,.08)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mis{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mis>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.mis small{color:var(--muted);font-variant-numeric:tabular-nums}
.mis.claimed{opacity:.55}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.tab.on{background:var(--danfo);color:var(--ink);border-color:var(--danfo)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.board li{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(244,236,217,.04);font-variant-numeric:tabular-nums}
.board li:not(:has(.rk)){grid-template-columns:1fr auto}
.board li.me{background:rgba(245,197,24,.12);outline:1px solid rgba(245,197,24,.5)}
.board .rk{font-family:var(--display);color:var(--danfo);min-width:22px}
.board span{color:var(--muted);font-size:13px}
.board .pts{color:var(--cream);font-weight:800;font-size:14px}
.field select{font:inherit;font-size:16px;color:var(--cream);background:#13241a;border:1px solid var(--line);border-radius:10px;padding:11px}
#hud{position:fixed}
.live{position:fixed;left:16px;top:calc(env(safe-area-inset-top,0px) + 132px);z-index:2;width:190px;max-width:44vw;background:rgba(9,18,13,.78);border:1px solid var(--line);border-radius:12px;padding:8px 10px;pointer-events:none;backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.live small{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:4px}
.live ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.live li{display:grid;grid-template-columns:20px 1fr auto;gap:6px;font-size:13px;align-items:center;padding:2px 4px;border-radius:6px}
.live li .rk{color:var(--danfo);font-weight:800}
.live li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live li.me{background:rgba(245,197,24,.18);color:var(--danfo);font-weight:800}
.live li.gap{display:block;text-align:center;color:var(--muted);padding:0;line-height:1}
.topnow{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;background:rgba(244,236,217,.03)}
.topnow h3{margin:0 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--danfo)}
.topnow ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px;font-variant-numeric:tabular-nums}
.topnow li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:baseline;min-width:0}
.topnow li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topnow li small{color:var(--muted);font-size:12px}
.topnow li .rk{color:var(--danfo);font-weight:800}
.topnow .none{color:var(--muted);font-size:13px}
.beat{border-left:3px solid var(--danfo);padding:4px 10px;font-size:14px}
@media (max-width:640px){.topnow{grid-template-columns:1fr}}
@media (max-width:460px){.live{top:calc(env(safe-area-inset-top,0px) + 120px);width:150px;font-size:12px}}
.fxrow{display:flex;gap:6px;flex-wrap:wrap}
#hFx{position:absolute;left:16px;top:calc(100% + 8px);max-width:60vw}
.fxp{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:rgba(9,18,13,.6);border:1px solid var(--c);color:var(--c);font-variant-numeric:tabular-nums}
.adbox{border:1px dashed var(--line);border-radius:12px;padding:28px 16px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;color:var(--muted)}
.adbox b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--cream)}
.sharecard{width:100%;height:auto;border-radius:12px;display:block}
.sharetext{font:inherit;font-size:13px;color:var(--cream);background:rgba(244,236,217,.06);border:1px solid var(--line);border-radius:10px;padding:8px;resize:none;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.sheet{max-height:calc(100% - 8px);overflow:auto}
.redeem{display:flex;gap:8px;flex-wrap:wrap}
.redeem input{font:inherit;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);background:rgba(244,236,217,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:1;min-width:0;-webkit-user-select:text;user-select:text}
.giftgrid{display:flex;flex-direction:column;gap:8px}
.giftcode{border:1px dashed var(--danfo);border-radius:12px;padding:12px;text-align:center}
.giftcode small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.giftcode b{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.06em;color:var(--danfo);-webkit-user-select:text;user-select:text}
a.btn{text-decoration:none;display:inline-flex;align-items:center;color:inherit}
a.btn.primary{color:var(--ink)}
.cat{margin-top:4px}
@media (max-width:640px){.modes{grid-template-columns:1fr}.streak{gap:4px}.streak span{font-size:11px;padding:5px 2px}.duelrow{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.snakes,.shopgrid{grid-template-columns:1fr}}
@media (max-width:460px){
  .levels,.who{grid-template-columns:1fr}
  .panel{padding:18px}
  .chip b{font-size:17px}
  .venom{display:none}
  #hud .vmini{display:block}
}
#hud .vmini{display:none}
#bubbles{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.bub{position:absolute;left:0;top:0;background:#fffaf0;color:#1b1a14;font-weight:700;font-size:13px;line-height:1.25;padding:6px 11px 7px;border-radius:14px;max-width:200px;width:max-content;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3);opacity:0;transition:opacity .2s;text-wrap:balance}
.bub.on{opacity:1}
.bub::after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fffaf0;border-bottom:0}
.bub small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;font-weight:800}
.bub.hunter{background:#ffe0d2}.bub.hunter::after{border-top-color:#ffe0d2}
.bub.think{background:#eaf3e4;font-style:italic;font-weight:600}
.bub.think::after{border:0;width:9px;height:9px;border-radius:50%;background:#eaf3e4;bottom:-13px;margin-left:-4px;box-shadow:-7px 8px 0 -2px #eaf3e4}
.bub.think small{font-style:normal}
.bub.gold{background:#fff1b8}.bub.gold::after{border-top-color:#fff1b8}
.pop{position:absolute;left:0;top:0;font-family:var(--display);font-size:22px;color:var(--danfo);text-shadow:0 2px 0 rgba(0,0,0,.5);white-space:nowrap;animation:rise 1.1s ease-out forwards}
.pop.cwp{color:#fffaf0;font-size:19px}
@keyframes rise{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -46px}}
.cw{display:inline-block;width:.78em;height:1em;border-radius:50%;background:radial-gradient(ellipse at 45% 30%,#fffdf6,#efe2c4 55%,#c8b083);position:relative;vertical-align:-.12em;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.cw::after{content:'';position:absolute;left:44%;top:16%;width:12%;height:68%;background:#6e5434;border-radius:2px}
.cwrow{display:flex;gap:6px;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.cwbuy{display:inline-flex;gap:6px;align-items:center}
.earn{font-size:13px;color:var(--muted);line-height:1.45}
@media (prefers-reduced-motion:reduce){#toast,.bar i{transition:none}.pop{animation-name:fadeonly}@keyframes fadeonly{from{opacity:1}to{opacity:0}}}

let ROAD=null;
const EDGEK={farm:['tree','bush'],court:['tree','bush'],forest:['tree','bush'],wild:['tree','bush'],yard:['tree','bush'],market:['bush','tree'],swamp:['reed','bush'],savanna:['acacia','bush'],den:['rock','bush'],lair:['rock','bush']};
function planRoad(L,r,li){
  const cx=W>>1,cz=H>>1,A=W*(.12+r()*.07),ph=r()<.5?1:-1,b=.2+r()*.5;
  const xAt=z=>{const t=(z-cz)/H;return Math.max(3.5,Math.min(W-4.5,cx-2.5+ph*A*Math.sin(t*PI*1.7)+A*b*Math.sin(t*PI*3.2)))};
  const cells=new Set();
  for(let z=0;z<H;z++){const xc=xAt(z),s=Math.abs(xAt(z+.5)-xAt(z-.5)),hw=1.15*Math.sqrt(1+s*s);for(let x=Math.floor(xc-hw);x<=Math.ceil(xc+hw);x++)if(x>=0&&x<W&&Math.abs(x-xc)<=hw)cells.add(x+','+z)}
  const w=(xg,zg)=>[xg-W/2+.5,zg-H/2+.5],pts=[];
  const sx=xAt(H-1),sl=xAt(H-1)-xAt(H-2);
  for(let d=70;d>0;d-=2)pts.push(w(sx+sl*Math.min(d,8)*.6+Math.sin(d*.07+ph)*4*Math.min(1,d/20),H-1+d));
  const inStart=pts.length;
  for(let z=H-1;z>=0;z-=.5)pts.push(w(xAt(z),z));
  const inEnd=pts.length;
  const x0=xAt(0),sl0=xAt(0)-xAt(1),dist=L.endless?115:150-Math.min(8,li||0)*10,cxg=x0+(r()-.5)*36;
  for(let d=1.5;d<=dist;d+=2){const t=d/dist,e=t*t*(3-2*t);pts.push(w(lerp(x0+sl0*Math.min(d,8)*.6,cxg,e)+Math.sin(d*.09+ph)*5*Math.sin(t*PI),-d))}
  const [gx,gz]=w(x0,-1.1),[cityX,cityZ]=w(cxg,-dist-14);
  ROAD={cells,xAt,pts,inStart,inEnd,gate:[gx,gz],city:[cityX,cityZ],km:L.endless?40:Math.max(4,96-(li||0)*11),
    boards:[[gx-7.5,gz-3.2],[gx+9,gz-3.6]],sign:[gx+3.4,gz-2.4],arm:null,armK:0,chev:[]};
}
// distance from a world point to the road centreline
function roadDist(x,z){const p=ROAD.pts;let best=1e9;for(let i=1;i<p.length;i++){const ax=p[i-1][0],az=p[i-1][1],bx=p[i][0]-ax,bz=p[i][1]-az;if(Math.abs(x-ax)>30&&Math.abs(z-az)>30)continue;const l=bx*bx+bz*bz||1;const t=Math.max(0,Math.min(1,((x-ax)*bx+(z-az)*bz)/l));const dx=x-ax-bx*t,dz=z-az-bz*t,d=dx*dx+dz*dz;if(d<best)best=d}return Math.sqrt(best)}
function genLayout(L,r){
  const g=GEN[L.theme],cells=new Map(),key=(x,z)=>x+','+z;
  const put=(x,z,k)=>{if(x>=0&&z>=0&&x<W&&z<H)cells.set(key(x,z),[x,z,k])};
  const pick=list=>{let t=r(),a=0;for(const [k,w] of list){a+=w;if(t<=a)return k}return list[0][0]};
  if(L.style==='maze'){
    const C=6,nx=Math.floor((W-3)/C),nz=Math.floor((H-3)/C),ox=Math.floor((W-nx*C)/2),oz=Math.floor((H-nz*C)/2);
    const wk=()=>g.wall2&&r()<.3?g.wall2:g.wall;
    for(let i=0;i<=nx;i++)for(let t=0;t<=nz*C;t++)put(ox+i*C,oz+t,wk());
    for(let j=0;j<=nz;j++)for(let t=0;t<=nx*C;t++)put(ox+t,oz+j*C,wk());
    const del=(x,z)=>cells.delete(key(x,z));
    const openV=(i,j)=>{for(let t=1;t<C;t++)del(ox+i*C,oz+j*C+t)}; // wall line x=i, cell row j
    const openH=(i,j)=>{for(let t=1;t<C;t++)del(ox+i*C+t,oz+j*C)}; // wall line z=j, cell col i
    const seen=new Uint8Array(nx*nz),st=[[Math.floor(r()*nx),Math.floor(r()*nz)]];seen[st[0][1]*nx+st[0][0]]=1;
    while(st.length){const [i,j]=st[st.length-1];const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[i+a,j+b]).filter(([a,b])=>a>=0&&b>=0&&a<nx&&b<nz&&!seen[b*nx+a]);
      if(!nb.length){st.pop();continue}const [a,b]=nb[Math.floor(r()*nb.length)];
      if(a!==i)openV(Math.max(a,i),j);else openH(i,Math.max(b,j));seen[b*nx+a]=1;st.push([a,b])}
    for(let i=1;i<nx;i++)for(let j=0;j<nz;j++)if(r()<.38)openV(i,j);
    for(let j=1;j<nz;j++)for(let i=0;i<nx;i++)if(r()<.38)openH(i,j);
    for(let j=0;j<nz;j++){if(r()<.5)openV(0,j);if(r()<.5)openV(nx,j)}
    for(let i=0;i<nx;i++){if(r()<.5)openH(i,0);if(r()<.5)openH(i,nz)}
    for(let n=0;n<g.extraN;n++){const x=Math.floor(r()*W),z=Math.floor(r()*H);if(!cells.has(key(x,z))&&(x-ox)%C!==0&&(z-oz)%C!==0&&r()<.8)put(x,z,pick(g.extra))}
  }else{
    const total=Math.floor(W*H*g.density);let placed=0,guard=0;
    while(placed<total&&guard++<5000){
      const k=pick(g.open);const size=k==='pond'?3+Math.floor(r()*7):(k==='bush'||k==='reed')?1+Math.floor(r()*4):1;
      let x=Math.floor(r()*W),z=Math.floor(r()*H);
      for(let s=0;s<size;s++){put(x,z,k);placed++;const d=DIRS[Math.floor(r()*4)];x+=d[0];z+=d[1]}
    }
  }
  // a ragged treeline instead of a straight fence: the forest edge pushes in by 0 to 2 cells
  const ek=EDGEK[L.theme]||['tree','bush'],a1=r()*9,a2=r()*9;
  const depth=t=>Math.max(0,Math.min(2,Math.floor(.55+1.1*Math.sin(t*.29+a1)+.6*Math.sin(t*.67+a2))));
  const ekind=()=>r()<.62?ek[0]:ek[1];
  for(let x=0;x<W;x++){for(let k=0;k<depth(x);k++)put(x,k,ekind());for(let k=0;k<depth(x+137);k++)put(x,H-1-k,ekind())}
  for(let z=0;z<H;z++){for(let k=0;k<depth(z+311);k++)put(k,z,ekind());for(let k=0;k<depth(z+523);k++)put(W-1-k,z,ekind())}
  for(const [k,c] of [...cells])if(inSpawnZone(c[0],c[1])||(ROAD&&ROAD.cells.has(k)))cells.delete(k);
  // any open ground the snake could never reach gets filled in, so food never spawns there
  const reach=new Uint8Array(W*H),q=[W>>1,H>>1];reach[(H>>1)*W+(W>>1)]=1;
  for(let h=0;h<q.length;h+=2){const x=q[h],z=q[h+1];for(const [dx,dz] of DIRS){const a=x+dx,b=z+dz;if(a<0||b<0||a>=W||b>=H||reach[b*W+a]||cells.has(key(a,b)))continue;reach[b*W+a]=1;q.push(a,b)}}
  for(let x=0;x<W;x++)for(let z=0;z<H;z++)if(!reach[z*W+x]&&!cells.has(key(x,z)))put(x,z,g.fill);
  return [...cells.values()];
}

/* ---------- tick ---------- */

  if(!inB(nx,nz)){
    if(nz<0&&ROAD&&ROAD.cells.has(nx+',0')){if(G.roadOpen)return cleared();return die(roadExit()?`The checkpoint is still closed. Eat ${G.L.goal-G.eaten} more to open it.`:'The checkpoint stays closed here. Turn back into the bush.')}

/* breadth-first distance maps so hunters find their way through mazes */
function bfs(srcs,passBody){
  const d=new Int16Array(W*H).fill(-1),occ=new Uint8Array(W*H),q=[];
  G.snake.forEach((s,i)=>{if(i>0)occ[s[1]*W+s[0]]=1});
  srcs.forEach(([x,z])=>{d[z*W+x]=0;q.push(x,z)});
  for(let h=0;h<q.length;h+=2){const x=q[h],z=q[h+1],v=d[z*W+x];
    for(const [dx,dz] of DIRS){const a=x+dx,b=z+dz;if(a<0||b<0||a>=W||b>=H)continue;const k=b*W+a;if(d[k]>=0||blocked[a][b]||(occ[k]&&!passBody))continue;d[k]=v+1;q.push(a,b)}}
  return d;
}

function distBody(){return G.dB||(G.dB=bfs(G.snake.slice(2),true))}

}
function moveEnt(e){

    const opts=DIRS.map(q=>[e.x+q[0],e.z+q[1],q]).filter(o=>canEnter(e,o[0],o[1]));
    if(opts.length){opts.sort((a,b)=>md(a,h)-md(b,h));if(md(opts[0],h)<d)return step(e,opts[0])}
    return;
  }
  if(c.flies&&d<=3&&Math.random()<.45){say(e,'I go just fly. Bye bye!','');teleport(e,10);e.cd=c.every;return}
  if(--e.cd>0)return;e.cd=c.every;
  if(c.kind!=='prey'&&G.grace>0)return;
  const opts=DIRS.map(q=>[e.x+q[0],e.z+q[1],q]).filter(o=>canEnter(e,o[0],o[1]));
  if(!opts.length)return;
  let target=null,sign=1,choice,field=null;
  if(c.kind==='block'){
    choice=opts.find(o=>o[2][0]===e.dir[0]&&o[2][1]===e.dir[1]);
    if(!choice||Math.random()<.12)choice=opts[Math.floor(Math.random()*opts.length)];
    e.dir=choice[2];return step(e,choice);
  }
  if(c.kind==='prey'){
    if(c.move==='flee'&&d<6){target=h;sign=-1;field=distHead()}
    else if(Math.random()<.45)return;
    if(c.move==='hop2'){const o=opts[Math.floor(Math.random()*opts.length)];const x2=o[0]+o[2][0],z2=o[1]+o[2][1];if(canEnter(e,x2,z2))return step(e,[x2,z2,o[2]]);return step(e,o)}
  }else if(c.hunt==='head'){target=h;sign=scared(e)?-1:1;field=distHead()}
  else if(c.hunt==='body'){if(G.fx.pepper>0){target=h;sign=-1;field=distHead()}else if(G.snake.length>2){target=G.snake[2];field=distBody()}}

  if(target&&Math.random()>.12){opts.sort((a,b)=>sign*(score(a)-score(b)));choice=opts[0]}

}

const GIFT_SKINS=['skin_danfo','skin_naija','skin_eko','skin_gold'];
const B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

const STREAK_CW=[10,15,20,25,30,40,0];
function checkStreak(){
  const t=todayStr();if(inv.lastDay===t)return null;
  const y=todayStr(new Date(Date.now()-864e5));
  inv.streak=inv.lastDay===y?(inv.streak||0)+1:1;inv.lastDay=t;

  let eyebrow,h,extra='',btns='';

  else if(G.mode==='daily'){eyebrow='Daily challenge';h=won?'Challenge complete!':'Not this time';extra=`<p class="muted">${G.daily.label}. ${won?(inv.dailyDone===todayStr()?`You earned ${DAILY_REWARD} cowries.`:''):'You can try again as many times as you like today.'}</p>`;btns=won?'':`<button class="btn primary" type="button" data-act="daily" data-primary>Try again</button>`}

    const nx=G.li+1;if(nx<LEVELS.length)btns=`<button class="btn primary" type="button" data-act="next" data-primary>Next: ${LEVELS[nx].name}</button><button class="btn" type="button" data-act="nextpick">Change snake</button>`;else{h='Oga of the whole bush';extra='<p>Both bosses are down. Try Endless Bush or today\'s challenge next.</p>';btns=`<button class="btn primary" type="button" data-act="endless" data-primary>Endless Bush</button>`}}
  else{eyebrow='Out of skins';h=`Chopped on ${G.L.name}`;extra=`<p class="muted">${G.lastMsg||''}</p>`;btns=`<button class="btn primary" type="button" data-act="retry" data-primary>Try again</button><button class="btn" type="button" data-act="retrypick">Change snake</button>`}
  const revive=!won&&G.mode!=='daily'?`<div class="btns">${`<button class="btn" type="button" data-act="revive">${inv.revive>0?`Use a revive (${inv.revive} left)`:`Revive for ${naira(ITEM.revive.price)}`}</button>`}${!inv.revive&&inv.cowries>=ITEM.revive.cw?`<button class="btn" type="button" data-act="cwrevive">Revive for ${CW} ${ITEM.revive.cw}</button>`:''}${!G.adRevived?`<button class="btn" type="button" data-act="adrevive">Watch an ad to revive</button>`:''}</div>`:'';
  screen(`<div class="panel"><div class="eyebrow${won?'':' warn'}">${eyebrow}</div><h2>${h}</h2>
    <div class="stats">${st}</div>${lw}${lv}${extra}${revive}

}

/* ---------- sign-up: name and username before the first game, email optional ---------- */
let signupAfter=null,signingUp=false;
function readProfile(nId,uId,eId){
  const name=($(nId).value||'').replace(/[<>"`\\]/g,'').replace(/\s+/g,' ').trim().slice(0,40);
  const username=($(uId).value||'').trim().replace(/\s+/g,'_');
  const email=($(eId).value||'').trim().toLowerCase();
  const f={name,username,email};
  if(name.length<2)f.error='Please enter your name.';
  else if(!/^[A-Za-z0-9_-]{3,14}$/.test(username))f.error='Usernames are 3 to 14 letters, numbers or underscores, with no spaces.';
  else if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))f.error='That email address does not look right. Leave it empty if you prefer.';
  return f;
}
// tell the game server about this player; if there is no server (or no signal) they still get to play
async function register(f){
  if(!API.base||API.ok===false)return{local:true};
  try{
    const r=await fetch(API.base+'/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pid:pid(),key:inv.pkey,name:f.name,username:f.username,email:f.email,area:inv.area||'Other'})});
    if(r.status===404||r.status===405){API.ok=false;return{local:true}}
    const j=await r.json().catch(()=>({}));
    if(!r.ok)return r.status>=500||r.status===429?{local:true,pending:true}:{error:j.error||'Sign-up did not go through. Try again.'};
    API.ok=true;return{};
  }catch(e){return{local:true,pending:true}}
}
function setProfile(f,r){
  const old=inv.profile||{};
  inv.profile={name:f.name,username:f.username,email:f.email,created:old.created||Date.now(),pending:!!(r&&r.pending)};
  inv.nick=f.username;
  if(f.email){payEmail=payEmail||f.email;try{if(!localStorage.getItem('ejo.email'))localStorage.setItem('ejo.email',f.email)}catch(e){}}
  NET.dirty=true;save();syncScores();ping();
}
function renderSignup(msg,after,draft){
  if(after)signupAfter=after;
  const p=draft||inv.profile||{};
  screen(`<div class="panel"><div class="eyebrow">Welcome to Ejo</div><h2>Sign up to play</h2>
    <p class="muted">Just your name and a username. Your username is how other players see you on the leaderboard.</p>
    <label class="field">Your name<input id="suName" maxlength="40" autocomplete="name" placeholder="e.g. Tunde Bakare" value="${esc(p.name||'')}"></label>
    <label class="field">Username<input id="suUser" maxlength="14" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="e.g. Tunde_Ikd" value="${esc(p.username||inv.nick||'')}"></label>
    <label class="field">Email <small class="muted">(optional, for receipts and game news)</small><input id="suEmail" type="email" inputmode="email" maxlength="80" autocomplete="email" placeholder="you@example.com" value="${esc(p.email||'')}"></label>
    ${msg?`<p class="err" role="alert">${msg}</p>`:''}
    <div class="btns"><button class="btn primary" type="button" data-act="signup" id="suGo">${signingUp?'Signing you up…':'Start playing'}</button></div></div>`);
  setTimeout(()=>{const el=!$('suName').value?$('suName'):!$('suUser').value||msg?$('suUser'):$('suGo');if(el)el.focus({preventScroll:true})},40);
}
async function doSignup(){
  if(signingUp)return;
  const f=readProfile('suName','suUser','suEmail');
  if(f.error)return renderSignup(f.error,null,f);
  signingUp=true;const b=$('suGo');if(b){b.disabled=true;b.textContent='Signing you up…'}

  setProfile(f,r);
  const after=signupAfter;signupAfter=null;

}

    return `<div class="item">${pic}<div class="top"><span><b class="nm">${i.name}</b></span>${badge?`<span class="badge">${badge}</span>`:''}</div><p>${i.desc}</p>${btn}</div>`};
  screen(`<div class="panel wide">
    <div><div class="eyebrow">Bush shop</div><h2>Boosts, skins and snakes</h2></div>
    ${invLine()}
    <p class="earn">Earn cowries as you play: rats and frogs drop 1, agamas and snails 2, eggs and hornbills 3, grasscutters 4, tortoises and mongooses 5, monitor lizards 8. Golden animals drop 10. Clearing levels, missions, daily challenges and login streaks pay too.</p>
    ${PAY.publicKey?'':'<p class="demo">Demo shop: purchases here unlock items for free so you can try them. Real Paystack payments switch on when the game is hosted with a Paystack key.</p>'}
    ${cats.map(c=>`<div class="cat">${c}</div><div class="shopgrid">${SHOP.filter(i=>i.cat===c).map(card).join('')}</div>`).join('')}
    <div class="cat">Have a gift code?</div>
    <div class="redeem"><input id="giftCode" placeholder="EJO-XXX-XXXXX" maxlength="16" autocomplete="off" aria-label="Gift code"><button class="buy" type="button" data-act="redeem">Redeem</button></div>
    <div class="btns"><button class="btn primary" type="button" data-act="back" data-primary>Back</button></div>
  </div>`);
}
function grant(item){
  if(item.grant)Object.entries(item.grant).forEach(([k,v])=>inv[k]=(inv[k]||0)+v);
  if(item.id==='pass'){inv.passUntil=Math.max(Date.now(),inv.passUntil||0)+30*864e5;inv.owned.skin_adire=true;inv.equipped='skin_adire'}
  if(item.gift){item.code=makeGift(item.gift);inv.giftsMade=(inv.giftsMade||[]).concat([item.code])}
  if(item.own){inv.owned[item.id]=true;if(SKINS[item.id])inv.equipped=item.id;if(item.id==='levels')unlocked=LEVELS.length-1;if(item.id==='sp_royal')chosen='royal'}
  save();if(G&&headMesh)buildHead(chosen);if(G){G.key=chosen;G.sp=SPECIES[chosen];if(G.state==='select'||G.state==='menu')G.lives=G.maxLives=G.sp.lives,G.shield=!!G.sp.shield}
}
function giftSheet(){
  const sh=$('sheet');sh.hidden=false;
  sh.innerHTML=`<div class="sheet" role="dialog" aria-label="Gift a skin"><div class="eyebrow">Gift a skin</div><h3>Pick a skin for your friend</h3>
    <div class="giftgrid">${GIFT_SKINS.map(k=>`<button class="skinbtn" type="button" data-sh="giftpick" data-k="${k}">${snakePic(chosen,k,'skinimg')}${SKINS[k].name} · ${naira(ITEM[k].price)}</button>`).join('')}</div>
    <p class="muted" style="font-size:13px">You get a code to send. Your friend types it into the shop to unlock the skin.</p>
    <div class="btns"><button class="btn" type="button" data-sh="cancel">Cancel</button></div></div>`;
}
let payEmail='';try{payEmail=localStorage.getItem('ejo.email')||''}catch(e){}
let checkout=null;
function openCheckout(id,after){const item=typeof id==='string'?ITEM[id]:id;checkout={item,after,stage:'form',err:''};renderSheet()}
function closeCheckout(){checkout=null;const sh=$('sheet');sh.hidden=true;sh.innerHTML=''}
function renderSheet(){
  const sh=$('sheet'),c=checkout;if(!c)return closeCheckout();sh.hidden=false;const i=c.item;
  if(c.stage==='done'){
    const gift=i.code?`<div class="giftcode"><small>Gift code</small><b id="giftOut">${i.code}</b></div><div class="btns"><button class="btn" type="button" data-sh="copygift">Copy code</button><a class="btn" href="https://wa.me/?text=${encodeURIComponent(`I got you the ${SKINS[i.gift].name} skin in Ejo! Open the game, go to the shop and enter this code: ${i.code} ${CONFIG.gameUrl}`)}" target="_blank" rel="noopener">Send on WhatsApp</a></div>`:'';
    sh.innerHTML=`<div class="sheet" role="dialog" aria-label="Purchase complete"><div class="eyebrow">Payment received</div><h3>${i.code?'Your gift is ready':i.name+' is yours'}</h3><p class="muted">${i.desc}</p>${gift}${i.code?'':invLine()}<div class="btns"><button class="btn primary" type="button" data-sh="ok">${c.after?'Continue':'Done'}</button></div></div>`;sh.querySelector('[data-sh="ok"]').focus();return}
  const busy=c.stage==='busy';
  sh.innerHTML=`<div class="sheet" role="dialog" aria-label="Checkout">
    <div><div class="eyebrow">Checkout</div><h3>${i.name}</h3></div>
    <div class="price">${naira(i.price)}</div>
    <p class="muted">${i.desc}</p>
    <label class="field">Email for your receipt<input id="payEmailIn" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="${payEmail.replace(/"/g,'&quot;')}" ${busy?'disabled':''}></label>
    ${c.err?`<p class="err">${c.err}</p>`:''}
    ${PAY.publicKey?'<p class="demo">Card, bank transfer or USSD through Paystack.</p>':'<p class="demo">Demo checkout: no money is taken here. With a Paystack key on your hosted game, this button opens Paystack for card, bank transfer or USSD.</p>'}
    <div class="btns"><button class="btn primary" type="button" data-sh="pay" ${busy?'disabled':''}>${busy?'Processing…':`Pay ${naira(i.price)}`}</button><button class="btn" type="button" data-sh="cancel" ${busy?'disabled':''}>Cancel</button></div>
  </div>`;
  if(!busy)setTimeout(()=>{const b=sh.querySelector('[data-sh="pay"]');if(b)b.focus({preventScroll:true})},30);
}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)&&window.PaystackPop)return res();const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=rej;document.head.appendChild(t)})}
function payWithPaystack(item,email){
  return loadScript('https://js.paystack.co/v1/inline.js').catch(()=>{throw new Error('Paystack could not load. Check your connection and try again.')}).then(()=>new Promise((res,rej)=>{
    const h=window.PaystackPop.setup({key:PAY.publicKey,email,amount:item.price*100,currency:'NGN',ref:'ejo_'+item.id+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),metadata:{item:item.id},
      callback:function(r){
        if(!PAY.verifyUrl)return res(r);
        fetch(PAY.verifyUrl+'?reference='+encodeURIComponent(r.reference)).then(x=>x.json()).then(j=>j&&j.ok?res(r):rej(new Error('We could not confirm this payment. If you were charged, contact support with reference '+r.reference+'.'))).catch(()=>rej(new Error('We could not reach the payment server. If you were charged, contact support with reference '+r.reference+'.')))
      },
      onClose:function(){rej(new Error('Payment window closed before paying.'))}});
    h.openIframe();
  }));
}
function doPay(){
  const c=checkout;const inp=$('payEmailIn');payEmail=(inp&&inp.value||'').trim();
  if(PAY.publicKey&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(payEmail)){c.err='Enter a valid email address so Paystack can send your receipt.';return renderSheet()}
  try{localStorage.setItem('ejo.email',payEmail)}catch(e){}
  c.stage='busy';c.err='';renderSheet();
  const p=PAY.publicKey?payWithPaystack(c.item,payEmail):new Promise(r=>setTimeout(r,900));
  p.then(r=>{track('purchase',{item:c.item.id,price:c.item.price,ref:(r&&r.reference)||'',demo:!PAY.publicKey});grant(c.item);c.stage='done';sfx(784,.08);setTimeout(()=>sfx(1046,.14),90);renderSheet()})
   .catch(e=>{c.stage='form';c.err=e.message;renderSheet()});
}
function copyText(text,el){
  const ok=()=>toast('Copied.','good');
  try{navigator.clipboard.writeText(text).then(ok,()=>selectEl(el))}catch(e){selectEl(el)}
}
function selectEl(el){if(!el)return;if(el.select){el.focus();el.select()}else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selected. Press copy on your keyboard or phone.')}
$('sheet').addEventListener('click',async ev=>{
  if(ev.target.id==='sheet'&&checkout&&checkout.stage!=='busy'){closeCheckout();return}
  const b=ev.target.closest('[data-sh]');if(!b)return;unlockAudio();const a=b.dataset.sh;
  if(a==='pay')doPay();
  else if(a==='cancel'||a==='close'){closeCheckout()}
  else if(a==='ok'){const after=checkout&&checkout.after;closeCheckout();if(after)after();else back(shopFrom==='shop'?'shop':shopFrom)}
  else if(a==='adok'){if(adDone){const f=adDone;adDone=null;f()}}
  else if(a==='giftpick'){const k=b.dataset.k,base=ITEM[k];openCheckout({id:'gift_'+k,gift:k,name:`Gift: ${SKINS[k].name} skin`,price:base.price,desc:`A code your friend can redeem for the ${SKINS[k].name} skin.`},()=>renderShop())}
  else if(a==='copygift'){copyText($('giftOut').textContent,$('giftOut'))}
  else if(a==='copy'){copyText($('shareText').value,$('shareText'))}
  else if(a==='saveimg'){
    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
    if(!dl||!shareCanvas){toast('Press and hold the picture to save it.');return}
    shareCanvas.toBlob(async blob=>{try{const r=await dl.save({filename:'ejo-run.png',data:blob});if(r&&r.status==='saved')toast('Picture saved.','good')}catch(e){toast('Press and hold the picture to save it.')}},'image/png');
  }
});
$('sheet').addEventListener('keydown',ev=>{if(ev.key==='Escape'&&checkout&&checkout.stage!=='busy'){ev.stopPropagation();closeCheckout()}if(ev.key==='Enter'&&ev.target.id==='payEmailIn')doPay()});
$('screen').addEventListener('change',ev=>{
  if(ev.target.id==='useLife')G.useLife=ev.target.checked;if(ev.target.id==='useVenom')G.useVenom=ev.target.checked;
  if(ev.target.id==='boardLv'){boardLi=+ev.target.value;renderBoard()}
});
function doRevive(){G.lives=1;G.maxLives=Math.max(G.maxLives,1);screen('');showPlayUI(true);respawn();toast('<big>Back in the bush</big>Revived with one skin. Everything you ate still counts.','good')}
function useRevive(){inv.revive--;save();doRevive()}
function startRun(li,score,opts){RUN={li,score,opts};pickSnake()}
function startDaily(){const d=getDaily();startRun(d.li,0,{mode:'daily',daily:d,goal:Infinity,level:d.li<0?ENDLESS_L:LEVELS[d.li],seed:d.seed%100000,weather:d.seed%3===0?'rain':'clear'})}
function startEndless(){startRun(-1,0,{mode:'endless',level:ENDLESS_L,seed:4242})}
$('screen').addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;unlockAudio();sfx(880,.04);
  const a=b.dataset.act;
  if(a==='level')startRun(+b.dataset.i,0,{mode:'levels'});
  else if(a==='sp'){setSpecies(b.dataset.k);renderPick();const f=$('screen').querySelector(`[data-k="${b.dataset.k}"]`);if(f)f.focus({preventScroll:true})}
  else if(a==='toIntro')intro();
  else if(a==='pick'){G.state='select';renderPick()}
  else if(a==='go')go();
  else if(a==='resume'){screen('');G.state='play';acc=0}
  else if(a==='retry'){if(G.mode==='duel'){menu();return}RUN.score=G.mode==='levels'?G.startScore:0;startLevel(RUN.li,RUN.score,RUN.opts);intro()}
  else if(a==='retrypick'){RUN.score=G.mode==='levels'?G.startScore:0;pickSnake()}
  else if(a==='next'){RUN={li:G.li+1,score:G.score,opts:{mode:'levels'}};startLevel(RUN.li,RUN.score,RUN.opts);intro()}
  else if(a==='nextpick'){RUN={li:G.li+1,score:G.score,opts:{mode:'levels'}};pickSnake()}
  else if(a==='quit'||a==='menu'){if(location.hash)try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}menu()}
  else if(a==='daily')startDaily();
  else if(a==='endless')startEndless();
  else if(a==='duel')duelSetup();
  else if(a==='duellv'){duelCtx={li:+b.dataset.i,p:1,res:[],weather:pickWeather(LEVELS[+b.dataset.i])};startRun(duelCtx.li,0,{mode:'duel',goal:10,weather:duelCtx.weather,seed:+b.dataset.i*97+13})}
  else if(a==='duelp2')startRun(duelCtx.li,0,{mode:'duel',goal:10,weather:duelCtx.weather,seed:duelCtx.li*97+13});
  else if(a==='acceptc'){const c=readChallenge();if(c)startRun(c.li,0,{mode:'friend',target:c})}
  else if(a==='missions')renderMissions();
  else if(a==='claim'){const m=MISSIONS.find(x=>x.id===b.dataset.id);if(m&&!inv.mclaimed[m.id]&&m.stat(stats())>=m.n){inv.mclaimed[m.id]=1;inv.cowries+=m.cw;save();toast(`<big>+${m.cw} cowries</big>${m.text}: done.`,'good');sfx(784,.08);setTimeout(()=>sfx(1046,.12),90);renderMissions()}}
  else if(a==='board'){if(!inv.nick)return renderSettings('Choose a name and area first, so your scores show up on the board.');renderBoard()}
  else if(a==='tab'){boardTab=b.dataset.k;renderBoard()}
  else if(a==='settings')renderSettings();
  else if(a==='saveset'){saveSettings().then(m=>renderSettings(m))}
  else if(a==='signup')doSignup();
  else if(a==='share')openShare();
  else if(a==='shop'){shopFrom=b.dataset.from||'menu';renderShop()}
  else if(a==='back')back(shopFrom);
  else if(a==='buy'){const id=b.dataset.id,cur=$('screen').querySelector('.sn')?'pick':'shop';
    openCheckout(id,()=>{if(cur==='pick'){if(id==='sp_royal')setSpecies('royal');G.state='select';renderPick()}else renderShop()})}
  else if(a==='equip'){inv.equipped=b.dataset.k;save();buildHead(chosen);const f=b.dataset.from;if(f==='shop')renderShop();else if(f==='pick')renderPick();else intro()}
  else if(a==='revive'){if(inv.revive>0)useRevive();else openCheckout('revive',()=>useRevive())}
  else if(a==='cwrevive'){const c=ITEM.revive.cw;if(inv.cowries>=c){inv.cowries-=c;save();doRevive()}}
  else if(a==='adrevive'){watchAd('revive',()=>{G.adRevived=true;doRevive()})}
  else if(a==='adcw'){if(adsLeft()>0)watchAd('cowries',()=>{inv.ads.n++;inv.cowries+=20;save();toast(`<big>+20 cowries</big>Thanks for watching.`,'good');renderShop()})}
  else if(a==='gift')giftSheet();
  else if(a==='redeem'){const r=await redeemGift($('giftCode').value);toast(r.msg,r.ok?'good':'bad');if(r.ok)renderShop()}
  else if(a==='cwbuy'){const it=ITEM[b.dataset.id],cw=it&&it.cw?cwPrice(it):0;if(cw&&inv.cowries>=cw){inv.cowries-=cw;grant(it);toast(`<big>${it.name}</big>Paid ${cw} cowries.`,'good');sfx(784,.08);renderShop()}}
});

/* ---------- input ---------- */
const KEY={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
function turnRel(side){if(!G||G.state!=='play')return;const l=G.queue.length?G.queue[G.queue.length-1]:G.dir;turn(side==='l'?[l[1],-l[0]]:[-l[1],l[0]])}
const REL={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'};
function turn(d){if(!G||G.state!=='play')return;const l=G.queue.length?G.queue[G.queue.length-1]:G.dir;if((d[0]===l[0]&&d[1]===l[1])||(d[0]===-l[0]&&d[1]===-l[1]))return;if(G.queue.length<3)G.queue.push(d)}
addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(KEY[k]&&G&&G.state==='play'){e.preventDefault();unlockAudio();if(view==='rear'){if(REL[k])turnRel(REL[k])}else turn(KEY[k]);return}
  if(k==='v'&&!checkout&&!(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))){cycleView();return}
  if(k===' '&&G&&G.state==='play'){e.preventDefault();if(G.sp.spit)spit();else pause();return}
  if(checkout)return;
  if(k==='Enter'&&e.target&&/^su(Name|User|Email)$/.test(e.target.id)){e.preventDefault();doSignup();return}
  if(k==='p'||k==='Escape'){if(G&&G.state==='play'){e.preventDefault();pause()}else if(G&&G.state==='paused'){e.preventDefault();screen('');G.state='play';acc=0}}
  if(k==='m')toggleMute();
});
let sx=0,sy=0,swiping=false;
renderer.domElement.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;swiping=true;unlockAudio()});
addEventListener('pointerup',e=>{if(!swiping)return;swiping=false;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(view==='rear'){if(Math.abs(dx)>Math.abs(dy))turnRel(dx<0?'l':'r');return}turn(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)])});
const PADD={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]};
$('pad').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-d]');if(!b)return;e.preventDefault();unlockAudio();if(b.dataset.d==='spit')spit();else if(view==='rear'){if(b.dataset.d==='l'||b.dataset.d==='r')turnRel(b.dataset.d)}else turn(PADD[b.dataset.d])});
$('viewBtn').addEventListener('click',cycleView);syncView();
$('pauseBtn').addEventListener('click',pause);
$('muteBtn').addEventListener('click',toggleMute);
function syncChat(){$('chatBtn').textContent=chatOn?'Chatter on':'Chatter off'}syncChat();
$('chatBtn').addEventListener('click',()=>{chatOn=!chatOn;try{localStorage.setItem('ejo.chat',chatOn?'on':'off')}catch(e){}if(!chatOn)clearBubs();syncChat()});
addEventListener('blur',()=>{if(G&&G.state==='play')pause()});

/* ---------- sound (3310-style beeps) ---------- */
let ac=null;
function unlockAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function sfx(f,d=.08,type='square',v=.04){if(!ac||muted)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d+.02)}catch(e){}}
function toggleMute(){muted=!muted;$('muteBtn').textContent=muted?'Sound off':'Sound on'}

menu();
requestAnimationFrame(frame);
addEventListener('hashchange',()=>{const c=readChallenge();if(c&&G&&G.state!=='play')challengeScreen(c)});
(function startup(){
  if(!inv.profile){renderSignup('',()=>{menu();welcome()});return}
  if(inv.profile.pending)register(inv.profile).then(r=>{if(r.error){inv.profile.pending=false;save();if(G&&G.state!=='play')renderSignup(r.error+' Pick another username.',()=>menu())}else if(!r.pending){inv.profile.pending=false;save()}});
  welcome();
})();
function welcome(){
  const c=readChallenge();if(c){const st=checkStreak();challengeScreen(c);if(st)toast(`<big>Day ${st.day} streak</big>You got ${st.reward.text}.`,'good');return}
  const st=checkStreak();if(st){const sh=$('sheet');sh.hidden=false;
    sh.innerHTML=`<div class="sheet" role="dialog" aria-label="Daily reward"><div class="eyebrow">Login streak · day ${st.day}</div><h3>Welcome back to the bush</h3><p>Today's reward: <b>${st.reward.text}</b>.${st.day<7?` Come back tomorrow for day ${st.day+1}.`:' Your streak starts a new week tomorrow.'}</p>${streakStrip()}<div class="btns"><button class="btn primary" type="button" data-sh="close">Collect</button></div></div>`;
    setTimeout(()=>{const b=sh.querySelector('button');if(b)b.focus()},50);menu()}
}
})();
</script>
